<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mensajes secretos y notas de afecto: fichas en 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg1:#bfe3ff;--bg2:#eef7ff;--paper:#fff;--ink:#1d2b53;--soft:#4a5b86;--soft2:#eaf3fd;--line:#cfe3f7;--sun:#ffc93c;--mint:#2fbf8f;--glow:rgba(74,163,240,.35);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#0b1230;--bg2:#1b2a5a;--paper:#1b2748;--ink:#f2f6ff;--soft:#b3c2e6;--soft2:#25345f;--line:#2c3b66;--glow:rgba(90,150,255,.3)}}
:root[data-theme="dark"]{--bg1:#0b1230;--bg2:#1b2a5a;--paper:#1b2748;--ink:#f2f6ff;--soft:#b3c2e6;--soft2:#25345f;--line:#2c3b66;--glow:rgba(90,150,255,.3)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 85%,var(--bg2),var(--bg1) 70%);color:var(--ink);font:400 1rem/1.5 Nunito,system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3,h4{font-family:Fredoka,"Trebuchet MS",sans-serif;font-weight:600;margin:0;line-height:1.15}
.wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:14px 0 18px}
.top{text-align:center;padding:0 16px}
.top h1{font-size:clamp(1.3rem,4vw,2rem)}
.top p{margin:4px 0 0;color:var(--soft);font-size:.95rem}
.stage{width:100%;perspective:1700px;touch-action:pan-y;cursor:grab;position:relative}
.stage:active{cursor:grabbing}
.stage::after{content:"";position:absolute;left:50%;bottom:-26px;width:min(620px,86vw);height:50px;transform:translateX(-50%);background:radial-gradient(ellipse,var(--glow),transparent 70%);pointer-events:none}
.ring{position:relative;width:var(--w);height:var(--h);margin:0 auto;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.22,.8,.2,1)}
.slot{position:absolute;inset:0;transform-style:preserve-3d;transition:opacity .6s}
.card{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .85s cubic-bezier(.3,.8,.2,1)}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--paper);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 18px 40px rgba(10,20,60,.28);outline:3px dotted var(--c);outline-offset:-9px}
.back{transform:rotateY(180deg)}
.band{background:var(--c);color:#fff;padding:20px 22px 18px;display:flex;gap:14px;align-items:center;flex:none}
.band .em{font-size:2.8rem;line-height:1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.18))}
.band small{font-weight:800;opacity:.92;display:block}
.band h2{font-size:clamp(1.25rem,3.6vw,1.6rem)}
.band.mini{padding:12px 18px}.band.mini h3{font-size:1.1rem}
.pad{padding:16px 22px;overflow:auto;flex:1;display:grid;gap:14px;align-content:start;scrollbar-width:thin}
.pad h4{font-size:1.05rem;margin:0 0 6px}
.why{background:var(--soft2);border-radius:14px;padding:12px 16px}
.why p{margin:0;font-size:.97rem}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:0;padding:0;list-style:none}
.chips li{border:2px solid var(--line);border-radius:999px;padding:3px 12px;font-weight:600;font-size:.9rem}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:9px}
ol.steps li{counter-increment:s;display:flex;gap:11px;align-items:flex-start;font-size:.95rem}
ol.steps li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font:600 .9rem Fredoka,sans-serif;margin-top:1px}
.talk{display:grid;gap:8px}
.bubble{background:var(--sun);color:#3a2d00;border-radius:16px 16px 16px 4px;padding:8px 14px;font-weight:600;font-size:.93rem;justify-self:start}
.bubble:nth-child(even){background:var(--mint);color:#06281d;border-radius:16px 16px 4px 16px;justify-self:end}
.gold{display:flex;gap:10px;border:3px dashed var(--sun);border-radius:14px;padding:10px 14px;font-size:.93rem}
.gold p{margin:0}
.foot{flex:none;padding:12px 22px 18px}
.flipbtn{width:100%;border:0;border-radius:999px;background:var(--c);color:#fff;padding:12px 18px;font:600 1.05rem Fredoka,sans-serif;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.2);transition:transform .15s,box-shadow .15s}
.flipbtn:hover{transform:translateY(2px);box-shadow:0 3px 0 rgba(0,0,0,.2)}
.ctrl{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;padding:0 12px}
.arrow{width:48px;height:48px;border-radius:50%;border:0;background:var(--paper);color:var(--ink);font:600 1.4rem Fredoka,sans-serif;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.15);transition:transform .15s}
.arrow:hover{transform:scale(1.1)}
.dots{display:flex;gap:10px}
.dot{--c:#4aa3f0;position:relative;width:52px;height:60px;border:0;border-radius:5px;background:var(--c);cursor:pointer;font-size:1.5rem;outline:2px dotted var(--c);outline-offset:3px;box-shadow:0 4px 0 rgba(0,0,0,.2);transition:transform .2s}
.dot::before{content:"";position:absolute;inset:4px;border:2px dashed rgba(255,255,255,.75);border-radius:3px}
.dot span{position:relative}
.dot:hover{transform:translateY(-4px)}
.dot[aria-current="true"]{transform:translateY(-8px) scale(1.12);outline:3px solid var(--ink)}
.hint{color:var(--soft);font-size:.88rem;margin:0;text-align:center}
button:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
.wrap{position:relative;z-index:1;min-height:100dvh}
.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.bg span{position:absolute;bottom:-12%;opacity:0;font-size:var(--s);animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}10%,85%{opacity:.5}100%{transform:translateY(-120vh) rotate(360deg);opacity:0}}
@keyframes drop{from{opacity:0;transform:translateY(-18px)}}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
@keyframes bob{50%{transform:translateY(-6px) rotate(-8deg)}}
@keyframes shine{40%,100%{transform:translateX(120%)}}
@keyframes hop{50%{transform:translateY(-14px) scale(1.12)}}
@keyframes pulse{50%{opacity:.55;transform:translateX(-50%) scale(1.12)}}
@keyframes spark{from{transform:translate(-50%,-50%) scale(.4);opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.3) rotate(120deg);opacity:0}}
.top{animation:drop .8s cubic-bezier(.3,1.4,.5,1) both}
.stage::after{animation:pulse 4s ease-in-out infinite}
.slot.on .band .em{animation:bob 2.2s ease-in-out infinite}
.slot.on .front .why{animation:up .6s .15s both}
.slot.on .front .chips li{animation:pop .5s calc(.3s + var(--i)*.09s) both}
.card.flip ol.steps li{animation:up .5s calc(.3s + var(--i)*.12s) both}
.card.flip .bubble{animation:pop .5s calc(.9s + var(--i)*.15s) both}
.card.flip .gold{animation:up .6s 1.4s both}
.flipbtn{position:relative;overflow:hidden}
.flipbtn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);transform:translateX(-120%);animation:shine 3.2s infinite}
.flipbtn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.arrow:active{transform:scale(.9)}
.dot[aria-current="true"]{animation:hop 1.6s ease-in-out infinite}
.spark{position:absolute;left:50%;top:50%;font-size:1.6rem;pointer-events:none;z-index:5;animation:spark 1s ease-out forwards}
@media (max-width:600px){.wrap{gap:12px;padding-top:8px}.dot{width:42px;height:50px;font-size:1.2rem}.dots{gap:7px}.arrow{width:42px;height:42px}.band{padding:16px 16px 14px}.pad{padding:12px 16px}.foot{padding:10px 16px 14px}.band .em{font-size:2.3rem}.top p{font-size:.85rem}.hint{font-size:.8rem;padding:0 14px}}
@media (min-width:900px){.wrap{gap:26px}.top p{font-size:1.05rem}.face{font-size:1.06rem}.hint{font-size:.95rem}}
.photo{flex:none;height:clamp(130px,31%,230px);overflow:hidden;position:relative;cursor:zoom-in}
.photo::before{content:"🔍 Ampliar";position:absolute;right:10px;bottom:10px;z-index:2;background:rgba(0,0,0,.55);color:#fff;font:600 .8rem Fredoka,sans-serif;padding:4px 10px;border-radius:999px}
.lb{position:fixed;inset:0;z-index:50;background:rgba(5,10,30,.88);display:none;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
.lb.open{display:flex;animation:fade .25s}
.lb img{max-width:100%;max-height:100%;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop .35s both}
@keyframes fade{from{opacity:0}}
.photo img{width:100%;height:100%;object-fit:cover;object-position:center 40%;display:block}
.photo::after{content:"";position:absolute;inset:0;box-shadow:inset 0 -16px 16px -16px rgba(0,0,0,.3)}
.slot.on .photo img{animation:kb 9s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.07)}}
@keyframes float{50%{transform:translateY(-5px) rotate(5deg)}}
.ttl{display:flex;align-items:center;justify-content:center;gap:10px}
.mascot{width:54px;height:54px;flex:none;border-radius:50%;object-fit:cover;border:3px solid var(--paper);box-shadow:0 4px 0 rgba(0,0,0,.15);animation:float 3.5s ease-in-out infinite}
@media (max-width:600px){.mascot{width:42px;height:42px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="lb" id="lb"><img id="lbi" alt=""></div>
<div class="bg" id="bg" aria-hidden="true"></div>
<div class="wrap">
<div class="top"><div class="ttl"><img class="mascot" id="mascot" alt="" width="54" height="54"><h1>Mensajes secretos y notas de afecto</h1></div><p>Fichas para familias con niños de 4 a 5 años</p></div>
<div class="stage" id="stage"><div class="ring" id="ring"></div></div>
<div class="ctrl"><button class="arrow" id="prev" type="button" aria-label="Ficha anterior">←</button><div class="dots" id="dots"></div><button class="arrow" id="next" type="button" aria-label="Ficha siguiente">→</button></div>
<p class="hint">Arrastra, usa las flechas o toca una ficha. Voltea la tarjeta para ver el paso a paso.</p>
</div>
