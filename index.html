<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mensajes secretos y notas de afecto</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{--fs:1rem;font:400 1rem/1.35 Nunito,system-ui,sans-serif;color:#1d2b53;background:radial-gradient(ellipse at 50% 100%,#eef7ff,#bfe3ff 75%) fixed;overflow-x:hidden}
h1,h2{font-family:Fredoka,"Trebuchet MS",sans-serif;font-weight:600;margin:0;line-height:1.1}
.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.bg span{position:absolute;bottom:-12%;opacity:0;font-size:var(--s);animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}10%,85%{opacity:.45}100%{transform:translateY(-120vh) rotate(360deg);opacity:0}}
@keyframes bob{50%{transform:translateY(-5px) rotate(-6deg)}}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
@keyframes inN{from{opacity:0;transform:translateX(180px) rotateY(-42deg) scale(.86)}}
@keyframes inP{from{opacity:0;transform:translateX(-180px) rotateY(42deg) scale(.86)}}
@keyframes outN{to{opacity:0;transform:translateX(-180px) rotateY(42deg) scale(.86)}}
@keyframes outP{to{opacity:0;transform:translateX(180px) rotateY(-42deg) scale(.86)}}
.page{position:relative;z-index:1;width:min(1600px,100%);margin:0 auto;padding:10px clamp(10px,1.6vw,24px) 14px;display:flex;flex-direction:column;gap:10px;min-height:100dvh}
.bar{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.mascot{width:46px;height:46px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.brand h1{font-size:clamp(1.05rem,2.2vw,1.6rem)}
.brand p{margin:0;color:#4a5b86;font-size:.82rem}
.tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tab{--c:#4aa3f0;display:flex;align-items:center;gap:7px;border:0;cursor:pointer;background:#fff;color:#1d2b53;border-radius:999px;padding:4px 14px 4px 4px;font:600 .88rem Fredoka,sans-serif;box-shadow:0 3px 0 rgba(0,0,0,.14);transition:transform .2s}
.tab i{font-style:normal;width:32px;height:32px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:1.05rem;flex:none}
.tab span{max-width:170px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab:hover{transform:translateY(-2px)}
.tab[aria-current=true]{background:var(--c);color:#fff;transform:translateY(-3px)}
.tab[aria-current=true] i{background:#fff}
.nav{width:42px;height:42px;border-radius:50%;border:0;background:#fff;font:600 1.3rem Fredoka;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.18);color:#1d2b53;flex:none}
.nav:hover{transform:scale(1.1)}
.stagewrap{perspective:1700px;flex:1;display:flex;min-height:0}
.sheet{--c:#4aa3f0;flex:1;min-height:0;display:grid;gap:12px 16px;padding:clamp(8px,1.2vh,16px) clamp(12px,1.8vw,26px) clamp(8px,1.2vh,14px);background:linear-gradient(#e9f7ff,#fff 45%);border:5px solid var(--c);border-radius:26px;box-shadow:0 16px 36px rgba(10,20,60,.25);animation:in .5s both;
grid-template-columns:1fr;grid-template-areas:"head" "photo" "mid" "steps" "chat" "tip"}
.sheet.in-next{animation:inN .65s cubic-bezier(.2,.9,.25,1) both}
.sheet.in-prev{animation:inP .65s cubic-bezier(.2,.9,.25,1) both}
.sheet.out-next{animation:outN .27s ease-in both}
.sheet.out-prev{animation:outP .27s ease-in both}
.head{grid-area:head;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;text-align:center}
.pill{background:var(--c);color:#fff;font:600 .95rem Fredoka;letter-spacing:.07em;padding:4px 18px;border-radius:999px;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.blob{display:flex;align-items:center;gap:12px;background:#ffd45c;border-radius:26px;padding:6px 22px;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.blob h2{font-size:clamp(1.25rem,3.6vh,2rem);color:#2b2b2b}
.blob .em{font-size:clamp(1.4rem,3.6vh,2rem);animation:bob 2.4s ease-in-out infinite}
.age{background:#ff6b8b;color:#fff;font:600 .88rem Fredoka;padding:3px 14px;border-radius:999px}
.age.t{background:#8b6ff0}
.photo{grid-area:photo;position:relative;min-height:0;border-radius:20px;overflow:hidden;border:4px solid #fff;box-shadow:0 6px 16px rgba(10,20,60,.28);cursor:zoom-in;background:#dbeeff;margin-top:16px;aspect-ratio:4/3}
.photo img{position:absolute;inset:0;width:100%;height:100%}
.photo img.pbg{object-fit:cover;filter:blur(16px) saturate(1.2);transform:scale(1.15)}
.photo img.main{object-fit:contain;z-index:1}
.photo::after{content:"🔍 Ampliar";position:absolute;right:8px;bottom:8px;z-index:2;background:rgba(0,0,0,.55);color:#fff;font:600 .8rem Fredoka;padding:3px 10px;border-radius:999px}
.mid{grid-area:mid;display:flex;flex-direction:column;gap:0;min-height:0}
.box{border:3px solid var(--rc);border-radius:22px;background:#fff;padding:10px 14px 12px;position:relative;margin-top:16px;animation:in .6s both;min-height:0}
.lab{display:inline-block;background:var(--rc);border-radius:14px;padding:3px 14px;margin:-24px 0 6px -4px;font:600 clamp(.95rem,2vh,1.2rem) Fredoka;color:#2b2b2b;box-shadow:0 3px 0 rgba(0,0,0,.1)}
.box p,.box li{margin:0;font-size:var(--fs)}
.why{--rc:#f6a8d3}.mats{--rc:#9fe6d8;flex:1}.steps{grid-area:steps;--rc:#cdbcf6;display:flex;flex-direction:column}.chat{grid-area:chat;--rc:#7fd8c6}.tip{grid-area:tip;--rc:#ffd45c;background:#fffbe9}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips span{background:#fde7f3;border-radius:999px;padding:2px 10px;font-weight:800;font-size:calc(var(--fs) * .85)}
.mats ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(74px,1fr));gap:8px}
.mats li{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;font-weight:800;font-size:calc(var(--fs) * .86);line-height:1.15}
.ic{width:var(--ic,60px);height:var(--ic,60px);border-radius:18px;background:#e6fbf6;border:3px dashed #5cc9b3;display:grid;place-items:center;font-size:calc(var(--ic,60px) * .55);box-shadow:0 3px 0 rgba(0,0,0,.08);animation:bob 3s ease-in-out infinite;animation-delay:var(--d)}
.steps ol{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.steps li{display:flex;gap:10px;align-items:flex-start}
.steps li b{flex:none;width:28px;height:28px;border-radius:50%;color:#fff;display:grid;place-items:center;font:600 .95rem Fredoka;background:var(--k);animation:pop .5s both}
.ex{margin-top:auto;padding-top:8px}
.ex div{background:#f3eefe;border:2px dashed #b9a5f2;border-radius:16px;padding:8px 12px;font-size:calc(var(--fs) * .95)}
.ex b{color:#6b4fd0}
.talk{display:grid;gap:6px}.bubble{justify-self:start}
.bubble{background:#ffc93c;color:#3a2d00;border-radius:16px 16px 16px 4px;padding:4px 14px;font-weight:700;font-size:calc(var(--fs) * .98)}
.bubble:nth-child(even){background:#2fbf8f;color:#06281d;border-radius:16px 16px 4px 16px}
.tip p+p{margin-top:6px;font-size:calc(var(--fs) * .92)}
.lb{position:fixed;inset:0;z-index:50;background:rgba(5,10,30,.88);display:none;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
.lb.open{display:flex}.lb img{max-width:100%;max-height:100%;border-radius:16px}
@media(min-width:900px) and (min-height:600px){
body{--fs:clamp(.8rem,1.72vh,1.02rem)}
.page{min-height:100dvh}.bar{flex-wrap:nowrap}
.sheet{grid-template-columns:1.2fr 1fr 1.1fr;grid-template-rows:auto minmax(min-content,1fr) auto;grid-template-areas:"head head head" "photo mid steps" "chat chat tip"}
.photo{aspect-ratio:auto}
.ic{--ic:clamp(40px,6vh,56px)}.sheet{gap:6px 16px}.mats ul{gap:6px}.page{padding-top:6px;gap:8px}
}
@media(max-width:899px){.tab span{display:none}.tab{padding:4px}.ic{--ic:60px}.lab{font-size:1.05rem}}
@media(max-width:1500px) and (min-width:900px){.tab span{display:none}.tab{padding:4px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.bar{justify-content:space-between}
.brand h1{white-space:nowrap;font-size:clamp(1.2rem,2.3vw,1.9rem)}
.ctrl{display:flex;align-items:center;gap:12px}
.tab{width:46px;height:46px;padding:0;justify-content:center;background:var(--c);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.tab i{background:transparent;width:auto;height:auto;font-size:1.45rem}
.tab[aria-current=true]{background:var(--c);transform:translateY(-3px) scale(1.18);box-shadow:0 0 0 3px #fff,0 0 0 6px var(--c),0 6px 0 rgba(0,0,0,.2)}
.tab[aria-current=true] i{background:transparent}
.chatrow{display:flex;gap:14px;align-items:stretch}
.talk{flex:1;min-width:0}
.snap{flex:none;width:clamp(150px,22vw,320px);position:relative;border-radius:16px;overflow:hidden;border:4px solid #fff;box-shadow:0 4px 12px rgba(10,20,60,.25);transform:rotate(1.5deg);min-height:110px;background:#dbeeff}
.snap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 35%}
.snap::after{content:attr(data-e);position:absolute;right:6px;bottom:2px;font-size:1.5rem}
@media(max-width:899px){.bar{justify-content:center;flex-direction:column}.brand h1{white-space:normal;text-align:center}.chatrow{flex-direction:column}.snap{width:100%;aspect-ratio:16/9}}

.snap{background:color-mix(in srgb,var(--c) 20%,#fff)}
.snap svg{position:absolute;inset:0;width:100%;height:100%}
.snap img{display:none}
.tab{width:34px;height:34px;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.tab i{font-size:1.05rem}
.tab[aria-current=true]{transform:translateY(-2px) scale(1.15);box-shadow:0 0 0 2px #fff,0 0 0 4px var(--c),0 4px 0 rgba(0,0,0,.2)}
.nav{width:34px;height:34px;font-size:1.1rem}
.ctrl{gap:9px}.tabs{gap:7px}

.cover{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2.2vh,22px);padding:clamp(10px,2vh,24px);background:radial-gradient(ellipse at 50% 100%,#eef7ff,#bfe3ff 75%);transition:opacity .6s,transform .6s;cursor:pointer}
.cover.hide{opacity:0;transform:scale(1.06);pointer-events:none}
.cover img{max-width:min(96vw,1500px);max-height:calc(100dvh - clamp(90px,15vh,130px));width:auto;height:auto;border-radius:26px;border:6px solid #fff;box-shadow:0 18px 44px rgba(10,20,60,.32);animation:cin .9s cubic-bezier(.2,.9,.25,1) both;object-fit:contain}
.cover .go{border:0;cursor:pointer;background:#ff6b8b;color:#fff;font:600 clamp(1.1rem,2.6vh,1.6rem) Fredoka,sans-serif;padding:10px 38px;border-radius:999px;box-shadow:0 6px 0 rgba(0,0,0,.22);animation:cin .9s .3s both,hop 1.8s 1.2s ease-in-out infinite;position:relative;overflow:hidden}
.cover .go:hover{filter:brightness(1.08)}
@keyframes cin{from{opacity:0;transform:translateY(24px) scale(.94)}}
@keyframes hop{50%{transform:translateY(-6px)}}
.mascot{cursor:pointer}
</style></head><body>

s:["Construyan el buzón. Decoren juntos la caja y háganle una ranura arriba.","Escriban una nota breve para su hijo, por ejemplo «¡Eres muy especial!», con un dibujo.","Invítenlo a responder con garabatos, dibujos o sus primeras letras.","Cada noche abran el buzón y «lean» juntos los mensajes con alegría."],
q:["¿Qué quisiste dibujarme en tu nota secreta hoy?","¿A quién de la familia le dejaremos el próximo mensaje?"],
g:"Si su hijo pasa el dedo sobre un garabato e inventa una historia, escúchenlo con atención. Está entendiendo el poder de la escritura."},
{k:"notitas",t:"Cazadores de notitas escondidas",e:"🔍",c:"#ff6b6b",
why:"A los 5 años disfrutan explorar y moverse. Buscar notas por la casa despierta la curiosidad por descubrir qué dicen las palabras y trabaja la atención y la lectura de pistas visuales.",
m:["Papel de reciclaje o sobres usados","Lápices de colores o crayones","Cinta adhesiva o ganchitos de ropa"],
s:["Escondan una nota con un dibujo sencillo y una palabra clave, como una cama y «Busca aquí».","Díganle: «¡Hay una notita secreta para ti!» y denle una pista hablada.","Al encontrarla, lean juntos. Él intenta descifrar el dibujo y la primera letra.","Ahora el niño dibuja su propio mensaje, por ejemplo un corazón, y lo esconde.","Ustedes lo buscan, se sorprenden y leen en voz alta lo que entendieron de su dibujo."],
q:["¿En qué rincón escondiste mi nota para que me costara un poquito encontrarla?","¿Qué pista me vas a dar para ayudarme a leer tu dibujo?","¿Cuál es el mejor lugar de la casa para dejar las notas de la familia?"],
g:"Dejen notas en lugares cotidianos: la almohada, la mochila o junto al plato del desayuno. Si solo dibuja líneas, celebren su esfuerzo sin pedir perfección."},
{k:"correo",t:"La oficina de las cartas mágicas",e:"💌",c:"#2fbf8f",
why:"El juego simbólico ayuda a entender para qué sirve escribir. Al representar situaciones de la vida diaria y asumir roles, los niños descubren que los mensajes tienen destinatarios.",
m:["Caja de cartón","Sobres y hojas reutilizadas","Lápices y marcadores","Tarjetas con nombres de familiares","Bolsita para llevar las cartas"],
s:["Armen un rincón que funcione como oficina de correos.","Transformen una caja en buzón y decórenla.","Invítenlo a elegir un personaje: cartero, escritor o encargado del correo.","Anímenlo a hacer cartas con dibujos, letras o palabras.","Pongan cada mensaje en un sobre y escriban el nombre de quien lo recibe.","Simulen la entrega y cambien de roles para que todos participen."],
q:["¿Para quién es esta carta?","¿Qué le vas a contar a la abuela en tu carta?","¿Quién será hoy el cartero?"],
g:"Usen nombres reales de la familia y dejen que el niño decida cómo avanza el juego. Ustedes solo acompañan."},
{k:"sentimientos",t:"El sobre sorpresa de los sentimientos",e:"💛",c:"#f0a010",
why:"Ayuda a reconocer y expresar emociones con dibujos y palabras, y muestra que escribir sirve para compartir lo que sentimos.",
m:["Sobres de papel","Tarjetas pequeñas","Lápices y crayones","Dibujos de emociones","Una cajita decorada"],
s:["Hagan tarjetas con dibujos de emociones: alegría, tristeza, sorpresa y cariño.","Pónganlas dentro de la cajita.","Invítenlo a sacar una tarjeta y reconocer la emoción.","Conversen sobre un momento en que sintió eso.","Pídanle un mensaje para alguien que necesite una palabra bonita.","Ayúdenlo a escribirlo, guárdenlo en un sobre y entréguenlo."],
q:["¿Cuándo te sentiste así?","¿Qué te gustaría decirle a esa persona?","¿Qué dibujo le haría sonreír?"],
g:"Respeten todas las emociones y no lo obliguen a contar lo que no quiere. Todas merecen ser escuchadas."},
{k:"diario",t:"Mi diario de palabras bonitas",e:"📒",c:"#8b6ff0",
why:"Fortalece la expresión de ideas y experiencias. El niño relaciona sus dibujos con palabras y significados, y escribe a su manera.",
m:["Hojas reutilizadas","Cartulina para la portada","Lápices y crayones","Pegamento","Fotos familiares o recortes"],
s:["Armen juntos un cuaderno pequeño y decoren la portada.","Conversen sobre momentos felices que han vivido en familia.","Invítenlo a elegir un recuerdo especial.","Pídanle que lo dibuje y escriba letras, palabras o su nombre.","Pregúntenle qué representa su dibujo y escriban debajo lo que cuente.","Cada día agreguen una página con un recuerdo o un mensaje cariñoso."],
q:["¿Qué fue lo más lindo de hoy?","¿Qué cuenta tu dibujo?","¿Qué palabra bonita quieres guardar en tu diario?"],
g:"Permitan que escriba a su manera y no lo comparen con otros niños. Relean juntos las páginas anteriores."}
];

{d:"15–20 min",h:["✍️ Lectoescritura inicial","💞 Vínculo familiar","🖍️ Motricidad fina"],ej:"Nota de ejemplo: «Te quiero mucho, mamá» con un corazón dibujado. Si el niño responde con un garabato, pídanle que les cuente qué dice. Lo importante es la intención de comunicar.",v:"Más reto: que escriba la primera letra de su nombre en cada nota. Más apoyo: usen solo dibujos y pegatinas."},
{d:"20–25 min",h:["👀 Atención visual","🧩 Lectura de pistas","🏃 Movimiento"],ej:"Pista hablada: «Está donde duermes y es blandito». Al encontrar la nota, miren juntos el dibujo y digan en voz alta la primera letra de la palabra.",v:"Con hermanos o amigos, cada uno esconde una nota para otro. Más reto: usen dos pistas dibujadas por nota."},
{d:"20–30 min",h:["🎭 Juego simbólico","🗣️ Vocabulario","🤝 Roles sociales"],ej:"El cartero toca: «¡Toc, toc! Carta para la abuela Rosa». El niño recibe, abre el sobre y «lee» con sus propias palabras lo que cree que dice.",v:"Agreguen sellos dibujados y un horario de reparto. Si hay hermanos, roten los roles de cartero, escritor y destinatario."},
{d:"15–20 min",h:["😊 Reconocer emociones","🗣️ Expresión oral","💛 Empatía"],ej:"Sacan la tarjeta de sorpresa y dicen: «Me sentí contento cuando jugamos en el parque». Pregunten cómo se nota esa emoción en la cara y en el cuerpo.",v:"Usen un espejo para imitar cada emoción. Más reto: inventen una emoción nueva y dibujen su carita."},
{d:"15–20 min al día",h:["💬 Expresión de ideas","🧠 Memoria","✏️ Escritura espontánea"],ej:"Página del día: un dibujo del parque y debajo lo que dice el niño: «Fui al parque con papá». El adulto lo escribe tal como lo dijo, en letra clara.",v:"Peguen una foto o una hoja seca de la salida. Cada semana relean el diario como si fuera un cuento."}
];
